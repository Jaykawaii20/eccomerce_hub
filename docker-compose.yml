version: '3.9'

services:
  api:
    build:
      context: ./admin/backend
      dockerfile: Dockerfile
    container_name: ecommerce_api
    restart: unless-stopped
    ports:
      - '4000:4000'
    env_file:
      - ./admin/backend/.env
    environment:
      NODE_ENV: production
    healthcheck:
      test: ['CMD', 'wget', '-qO-', 'http://localhost:4000/api/v1/health']
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
    depends_on:
      - nginx

  web:
    build:
      context: ./admin/frontend
      dockerfile: Dockerfile
    container_name: ecommerce_web
    restart: unless-stopped
    ports:
      - '3000:3000'
    env_file:
      - ./admin/frontend/.env.local
    environment:
      NODE_ENV: production
    healthcheck:
      test: ['CMD', 'wget', '-qO-', 'http://localhost:3000']
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s

  nginx:
    image: nginx:alpine
    container_name: ecommerce_nginx
    restart: unless-stopped
    ports:
      - '80:80'
      - '443:443'
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/ssl:/etc/nginx/ssl:ro
    depends_on:
      - api
      - web

# NOTE: No postgres or redis containers — those are Supabase-managed (cloud)
# and Upstash Redis (serverless). No local DB containers needed in production.
